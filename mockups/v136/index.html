<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>v136 古いブラウザで開いたときの知らせ</title>
<!-- 古い macOS の Safari などで開くと真っ白になるため、代わりに知らせを出す案（依頼者 2026-11-17）。
     node scripts/mockup-v136-old-browser.mjs → mockups/v136/v136-old-browser.png -->
<link rel="stylesheet" href="../../node_modules/@fontsource/biz-udpgothic/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/biz-udpgothic/700.css">
<style>
  :root { --ink: #23262b; --muted: #5b5e65; --line: #ddd8cf; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 26px 30px 34px; width: 1080px; background: #f3f1ec; color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 14px; line-height: 1.6; }
  h1 { margin: 0 0 4px; font-size: 21px; }
  .intro { margin: 0 0 20px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
  .card { background: #fff; border-radius: 12px; padding: 12px 12px 14px; box-shadow: 0 1px 4px rgba(30, 25, 20, 0.1); }
  .card h2 { margin: 0 0 2px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  .card h2 .rec { padding: 1px 9px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 400; }
  .card p { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
  .shots { display: grid; grid-template-columns: 680px 260px; gap: 10px; align-items: start; }
  .shots img { display: block; width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .cap { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <h1>古いブラウザで開いたときの知らせ</h1>
  <p class="intro">いまは真っ白になるだけです。左は Mac（Safari 15.6）、右は iPhone（iOS 15）で開いたときです。</p>
  <div class="row">
    <div class="card">
      <h2>案A　文字だけ</h2>
      <p>「読み込んでいます…」と同じ所に、文だけを出す。</p>
      <div class="shots"><div><img src="screens/pc-a.png" alt=""><p class="cap">Mac</p></div><div><img src="screens/phone-a.png" alt=""><p class="cap">iPhone</p></div></div>
    </div>
    <div class="card">
      <h2>案B　新しくする方法を先に <span class="rec">おすすめ</span></h2>
      <p>カードにまとめ、新しくする手順を色の付いた枠で。ほかの端末で開くことは、その下に。</p>
      <div class="shots"><div><img src="screens/pc-b.png" alt=""><p class="cap">Mac</p></div><div><img src="screens/phone-b.png" alt=""><p class="cap">iPhone</p></div></div>
    </div>
    <div class="card">
      <h2>案C　ほかの端末を先に</h2>
      <p>「スマホか大学のパソコンで」を先に。新しくする手順は、その下に小さく。</p>
      <div class="shots"><div><img src="screens/pc-c.png" alt=""><p class="cap">Mac</p></div><div><img src="screens/phone-c.png" alt=""><p class="cap">iPhone</p></div></div>
    </div>
  </div>
</body>
</html>
